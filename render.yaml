# Render Blueprint: one-click deploy of the web app. The database lives in a
# managed cloud MySQL (set the DB_* secrets in the Render dashboard).
services:
  - type: web
    name: tourneyhub
    runtime: docker
    plan: free
    healthCheckPath: /view/login.php
    envVars:
      - key: DB_DRIVER
        value: mysql
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Dhaka
